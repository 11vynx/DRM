<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="js/demo-api-adapter.js"></script>
    <title>LGU Incident Report - DRM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/report.css" />
    <link rel="stylesheet" href="css/lgu-incidents.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><i class="bi bi-clipboard2-plus"></i> DRM - LGU Report</a
        >
        <div class="navbar-nav ms-auto">
          <span class="nav-text me-3" style="color: #e2e8f0">
            <i class="bi bi-shield-check"></i> <span id="lguName">-</span>
          </span>
        </div>
      </div>
    </nav>

    <div
      class="modal fade"
      id="lguVerificationModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div
            class="modal-header"
            style="background: #2d3748; color: white; border: none"
          >
            <h5 class="modal-title">
              <i class="bi bi-lock-fill"></i> LGU Verification Required
            </h5>
          </div>
          <div class="modal-body">
            <p class="mb-3" style="color: #333; font-weight: 500">
              Enter your LGU code to proceed:
            </p>
            <div class="mb-3">
              <label
                for="lguCodeInput"
                class="form-label"
                style="color: #2d3748; font-weight: 500"
                >LGU Code</label
              >
              <input
                type="text"
                class="form-control"
                id="lguCodeInput"
                placeholder="Enter your LGU code"
                autocomplete="off"
                style="
                  border-color: #e2e8f0;
                  padding: 0.75rem;
                  border-radius: 4px;
                "
              />
              <div
                id="verificationError"
                class="text-danger mt-2"
                style="font-size: 0.875rem"
              ></div>
            </div>
          </div>
          <div
            class="modal-footer"
            style="border-top: 1px solid #e2e8f0; padding: 1rem"
          >
            <button
              type="button"
              class="btn btn-primary"
              onclick="verifyLguCode()"
              style="
                background: #2d3748;
                border: none;
                border-radius: 4px;
                padding: 0.75rem 1.5rem;
                font-weight: 500;
              "
            >
              <i class="bi bi-check-circle"></i> Verify
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="container py-5">
      <div id="reportFormSection">
        <div class="card shadow-sm p-4">
          <h3 class="mb-4 text-center">
            <i class="bi bi-clipboard2-plus"></i> Submit Incident Report
          </h3>
          <form id="reportForm" class="row g-3">
            <div class="col-12">
              <label class="form-label">Operation / Incident Name</label
              ><input name="operation_name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Incident Type</label
              ><select name="disaster_type" class="form-select" required>
                <option value="" selected disabled>Select type</option>
                <optgroup label="Emergency Events">
                  <option>Flood</option>
                  <option>Earthquake</option>
                  <option>Landslide</option>
                  <option>Fire</option>
                  <option>Typhoon</option>
                  <option>Volcanic Eruption</option>
                  <option>Storm Surge</option>
                  <option>Drought</option>
                  <option>Tsunami</option>
                </optgroup>
                <optgroup label="Non-Emergency Events">
                  <option value="Non-Emergency">Non-Emergency</option>
                </optgroup>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Severity Level</label
              ><select name="severity" class="form-select" required>
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Barangay</label
              ><select id="barangaySelect" class="form-select" required>
                <option value="" disabled selected>Select Barangay</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Date & Time of Occurrence</label
              ><input
                name="datetime"
                type="datetime-local"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label">Estimated Affected Population</label
              ><input
                name="affected_population"
                type="number"
                class="form-control"
                min="0"
                placeholder="Optional"
              />
            </div>
            <div class="col-12">
              <label class="form-label">Brief Situation Description</label
              ><textarea
                name="description"
                class="form-control"
                rows="3"
                required
              ></textarea>
            </div>
            <div class="col-12">
              <label class="form-label"
                >Immediate Needs & Resources Required</label
              ><textarea
                name="remarks"
                class="form-control"
                rows="2"
                placeholder="List immediate needs like medical aid, evacuation, food, etc."
              ></textarea>
            </div>
            <div class="col-12 text-center">
              <button class="btn btn-primary px-4" type="submit">
                <i class="bi bi-check-circle"></i> Submit Report
              </button>
            </div>
          </form>
        </div>

        <div
          class="text-center mt-4"
          id="toggleIncidentsButtonContainer"
          style="display: none"
        >
          <button
            class="btn btn-outline-secondary"
            onclick="showIncidentsPage()"
            id="toggleIncidentsButton"
          >
            <i class="bi bi-eye"></i> View Reported Incidents
          </button>
        </div>
      </div>

      <div
        id="myIncidentsSection"
        class="card shadow-sm p-4"
        style="display: none"
      >
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <button
              class="btn btn-outline-secondary me-3"
              onclick="showReportFormPage()"
            >
              Back to Report Form
            </button>
          </div>
          <h4 class="mb-0 flex-grow-1 text-center">My Reported Incidents</h4>
          <button
            class="btn btn-sm btn-outline-primary"
            onclick="loadMyIncidents()"
          >
            Refresh
          </button>
        </div>

        <div id="incidentsTableContainer" class="table-responsive">
          <table class="table table-hover">
            <thead class="table-light">
              <tr>
                <th style="width: 8%">ID</th>
                <th style="width: 30%">Title</th>
                <th style="width: 15%">Type</th>
                <th style="width: 12%">Severity</th>
                <th style="width: 18%">Location</th>
                <th style="width: 12%">Status</th>
                <th style="width: 15%">Reported On</th>
              </tr>
            </thead>
            <tbody id="incidentsTableBody">
              <tr>
                <td colspan="7" class="text-center py-4">
                  <div
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                  >
                    <span class="visually-hidden">Loading...</span>
                  </div>
                  Loading your incidents...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div
          id="noIncidentsMessage"
          style="display: none"
          class="text-center py-4 text-muted"
        >
          <p class="mt-2">No incidents reported yet.</p>
        </div>
      </div>

      <!-- Incident Details Modal -->
      <div
        class="modal fade"
        id="incidentDetailsModal"
        tabindex="-1"
        aria-labelledby="incidentDetailsModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header" style="background: #2d3748; color: white">
              <h5 class="modal-title" id="incidentDetailsModalLabel">
                Incident Details
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body" id="incidentDetailsBody">
              <!-- Content will be populated by JavaScript -->
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/lgu-report.js"></script>
  </body>
</html>
