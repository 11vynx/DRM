<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="js/demo-api-adapter.js"></script>
    <title>Create Incident Report</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/report.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><i class="bi bi-clipboard2-plus"></i> DRM - Create Incident Report</a
        >
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html"
            ><i class="bi bi-arrow-left"></i> Back to Admin</a
          >
          <a class="nav-link" href="#" onclick="logout()"
            ><i class="bi bi-box-arrow-right"></i> Logout</a
          >
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="card shadow-sm p-4">
        <h3 class="mb-4 text-center">
          <i class="bi bi-clipboard2-plus"></i> Create Incident Report
        </h3>
        <form id="reportForm" class="row g-3">
          <div class="col-12">
            <label class="form-label">Operation / Incident Name</label
            ><input name="operation_name" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Incident Type</label
            ><select name="disaster_type" class="form-select" required>
              <option value="" selected disabled>Select type</option>
              <optgroup label="Emergency Events">
                <option>Flood</option>
                <option>Earthquake</option>
                <option>Landslide</option>
                <option>Fire</option>
                <option>Typhoon</option>
                <option>Volcanic Eruption</option>
                <option>Storm Surge</option>
                <option>Drought</option>
                <option>Tsunami</option>
              </optgroup>
              <optgroup label="Non-Emergency Events">
                <option value="Non-Emergency">Non-Emergency</option>
              </optgroup>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Severity Level</label
            ><select name="severity" class="form-select" required>
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">City / Municipality</label
            ><select id="lguSelect" class="form-select" required>
              <option value="" disabled selected>
                Select City/Municipality
              </option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Barangay</label
            ><select id="barangaySelect" class="form-select" required>
              <option value="" disabled selected>Select Barangay</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Date & Time of Occurrence</label
            ><input
              name="datetime"
              type="datetime-local"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Estimated Affected Population</label
            ><input
              name="affected_population"
              type="number"
              class="form-control"
              min="0"
              placeholder="Optional"
            />
          </div>
          <div class="col-12">
            <label class="form-label">Brief Situation Description</label
            ><textarea
              name="description"
              class="form-control"
              rows="3"
              required
            ></textarea>
          </div>
          <div class="col-12">
            <label class="form-label"
              >Immediate Needs & Resources Required</label
            ><textarea
              name="remarks"
              class="form-control"
              rows="2"
              placeholder="List immediate needs like medical aid, evacuation, food, etc."
            ></textarea>
          </div>
          <div class="col-12 text-center">
            <button class="btn btn-primary px-4" type="submit">
              <i class="bi bi-check-circle"></i> Create Report
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="js/report.js"></script>
  </body>
</html>
